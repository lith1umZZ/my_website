<!DOCTYPE html>
<html>
<head>
    <title>注册 - Li Jia's Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-card">
        <h2 style="text-align: center; margin-bottom: 25px;">📝 注册</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash-msg flash-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="用户名" required class="auth-input">
            <input type="password" name="password" placeholder="密码" required class="auth-input">
            <input type="password" name="confirm" placeholder="确认密码" required class="auth-input">
            <button type="submit" class="auth-btn">✨ 注册</button>
        </form>

        <p style="text-align: center; margin-top: 18px; color: var(--text-secondary);">
            已有账号？<a href="/login" class="auth-link">去登录</a>
        </p>
        <p style="text-align: center; color: var(--text-secondary);">
            <a href="/guestbook" class="auth-link">← 返回留言板</a>
        </p>
    </div>
</body>
</html>
